<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Crew cards</title>
<!-- AI Crew's crew cards as a web page over the game (fse's shells, cards.lua): one card per crew member in the bottom
     right, see-through between them. State comes from the mod ({cards}), a click goes back ({cmd = "open"}). -->
<link rel="stylesheet" href="/shell/shell.css">
<script src="/shell/shell.js"></script>
<link rel="stylesheet" href="cards.css">
</head>
<body>
<div id="cards" class="cards"></div>
<svg width="0" height="0" style="position:absolute">
  <!-- the orders' icons -->
  <symbol id="o-build" viewBox="0 0 16 16"><path d="M2 14l6-6M6 4l2-2 6 6-2 2zM8 2l1-1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="o-deconstruct" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="o-upgrade" viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="o-deliver" viewBox="0 0 16 16"><path d="M2 5l6-3 6 3v6l-6 3-6-3zM2 5l6 3 6-3M8 8v6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="o-follow" viewBox="0 0 16 16"><circle cx="8" cy="4" r="2.2" fill="currentColor"/><path d="M4 14c0-3 1.8-5 4-5s4 2 4 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="o-roam" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 5.5L9 9 5.5 10.5 7 7z" fill="currentColor"/></symbol>
  <symbol id="o-stop" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor"/></symbol>
  <symbol id="o-attack" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/><path d="M8 0.5v4M8 11.5v4M0.5 8h4M11.5 8h4" stroke="currentColor" stroke-width="1.7"/></symbol>
</svg>
<script src="cards.js"></script>
</body>
</html>
