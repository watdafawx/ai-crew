[mod-setting-description]
ai-crew-provider=Who answers free-form chat (plain orders like "build" or "get 50 iron ore" never need it). auto: picked from the API key (sk-or- OpenRouter, gsk_ Groq, AIza Gemini, csk- Cerebras, sk_ Pollinations). off: simple orders only. Needs the fnative loader.
ai-crew-api-key=Free keys: openrouter.ai/keys, console.groq.com/keys, aistudio.google.com/apikey, cloud.cerebras.ai. Or set OPENROUTER_API_KEY / GROQ_API_KEY / GEMINI_API_KEY / CEREBRAS_API_KEY / MISTRAL_API_KEY before starting the game.
ai-crew-model=Optional. Blank picks one (on OpenRouter, a free model).
ai-crew-voices=Text to speech for the crew's lines (needs the fnative loader). pip install edge-tts for natural voices, else Windows' own voices.
ai-crew-ada=Research done, new science, rocket launches, deaths.
ai-crew-ada-llm=Uses one AI request per announcement.
ai-crew-ada-voice=The neural voice under ADA's effects (chorus and a detuned echo, like Satisfactory's; needs edge-tts and ffmpeg).
ai-crew-chatter=After 2 minutes without input the crew talk among themselves every minute or so (written by the AI when one is set up, else stock lines).
