[mod-setting-description]
ai-crew-provider=Who answers free-form chat (plain orders like "build" or "get 50 iron ore" never need it). auto: picked from the API key (sk-or- OpenRouter, gsk_ Groq, AIza Gemini, csk- Cerebras, sk_ Pollinations). off: simple orders only. Needs the fse loader.
ai-crew-api-key=Free keys: openrouter.ai/keys, console.groq.com/keys, aistudio.google.com/apikey, cloud.cerebras.ai. Or set OPENROUTER_API_KEY / GROQ_API_KEY / GEMINI_API_KEY / CEREBRAS_API_KEY / MISTRAL_API_KEY before starting the game.
ai-crew-model=Optional. Blank picks one (on OpenRouter, a free model).
ai-crew-voices=Text to speech for the crew's lines (needs the fse loader). Kokoro's voices, made on your computer (uv pip install kokoro-onnx).
ai-crew-lines-llm=Their news (biters, a nest, research, fishing...) in their own words: one AI request per line said out loud (needs the fse loader and an AI key). Without an AI that answers, the stock lines.
ai-crew-voice-volume=How loud the crew's voices are, 0 to 100.
ai-crew-ada-volume=How loud ADA (and her chime) is, 0 to 100.
ai-crew-ada=Research done, new science, rocket launches, deaths.
ai-crew-ada-llm=Uses one AI request per announcement.
ai-crew-ada-voice=ADA's Kokoro voice, made on your computer (uv pip install kokoro-onnx), under her effects (chorus and a detuned echo, like Satisfactory's; needs ffmpeg). alice and lily are British.
ai-crew-jetpack=The crew fly over what's in their way (machines, walls, water) and to fights, up to 32 tiles a hop. Off: they step through blockages a few tiles at a time.
ai-crew-machines=When something they need is only made in a machine (plates in a furnace) and none is free, they may put one down. Off: never. Either way they fetch what's already made from chests and belts first.
ai-crew-back-after-orders=Sent off to get, mine, craft, build or deliver something, a crew member goes back to where it stood once that's done and there's nothing more to do (when more than 16 tiles away, and unless it roams or follows you). Off: it stays where the work ended.
ai-crew-hints=The crew point out research to start, machines starved of an ingredient or backed up, power running short, oversupply, and what to do next when nothing has happened for 5 minutes. One every 5 minutes at most, in chat and out loud.
ai-crew-new-mode=What a crew member you hire does: roam (wander round the base doing what needs doing, and come to you when you're attacked), follow you, or stay where it is.
ai-crew-tier-upgrades=Roaming, the crew swap your machines, inserters and furnaces for the next tier when that item is already in your pockets, chests or network (never made for it). Not belts: a partly upgraded belt only holds the rest back.
ai-crew-chatter=After 2 minutes without input the crew talk among themselves every minute or so (written by the AI when one is set up, else stock lines).
